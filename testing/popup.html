<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            width: 340px; 
            background-color: #2c2c2c; 
            color: #b0c4de; 
            font-family: 'Verdana', sans-serif; 
            padding: 25px; 
            border: 2px solid #4682b4; 
            border-radius: 10px;
        }
        h2 { 
            font-size: 15pt; 
            margin: 0 0 20px 0; 
            color: #6495ed; 
            text-align: center; 
            letter-spacing: 1px;
            border-bottom: 2px solid #4682b4; 
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .header-icon {
            width: 28px;
            height: 28px;
        }
        
        .row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            font-weight: bold;
            font-size: 11pt;
            color: #b0c4de; 
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; 
            transition: .3s;
            border-radius: 34px;
            border: 1px solid #4682b4;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 4px; bottom: 3px;
            background-color: #b0c4de; 
            transition: .3s;
            border-radius: 50%;
        }
        
        input:checked + .slider { 
            background-color: #4682b4; 
        }
        input:checked + .slider:before { 
            transform: translateX(20px); 
            background-color: #1a1a1a; 
        }

        .btn { 
            width: 100%; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            margin-top: 10px; 
            font-size: 11pt;
            border: none;
            text-transform: uppercase;
        }
        
        #saveBtn { 
            background-color: #4682b4; 
            color: #1a1a1a; 
        }
        #saveBtn:hover, #primaryBtn:hover { background-color: #6495ed !important; }
        
        #clearBtn { 
            background-color: #1a1a1a; 
            color: #708090; 
            border: 1px solid #708090; 
            font-size: 9pt; 
            margin-top: 20px;
            transition: 0.3s;
        }
        #clearBtn:hover, #wipeAllBtn:hover { 
            color: #cd5c5c !important; /* Indian Red */
            border-color: #cd5c5c !important; 
            background-color: #332222 !important; 
        }
        
        #wipeAllBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-icon {
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>
    <h2>
        <img src="icons/icon-toolbar/magnet-grabber-classic-red-white-horseshoe-magnet-indigo-background.svg" class="header-icon">
        MAGNET GRABBER <br>!TESTING VERSION!<br> Check for updates to download the latest release.
        <img src="icons/icon-toolbar/magnet-grabber-classic-red-white-horseshoe-magnet-indigo-background.svg" class="header-icon">
    </h2>
    
    <div class="row">
        <span>!TESTING VERSION!<br> Allow Identical Page Links</span>
        <label class="switch"><input type="checkbox" id="dupToggle"><span class="slider"></span></label>
    </div>
    
    <div class="row">
        <span>!TESTING VERSION!<br> Magnet Only Mode</span>
        <label class="switch"><input type="checkbox" id="magToggle"><span class="slider"></span></label>
    </div>
    
    <div class="row">
        <span>!TESTING VERSION!<br> Enable Log to File</span>
        <label class="switch"><input type="checkbox" id="logToggle"><span class="slider"></span></label>
    </div>

    <button id="primaryBtn" class="btn" style="background-color: #4682b4; color: #1a1a1a; margin-bottom: 10px;">!TESTING VERSION! <br>Download Primary Log (0)</button>
    <button id="saveBtn" class="btn">!TESTING VERSION!<br> Download Site Log (0)</button>
    <button id="wipeAllBtn" class="btn" style="margin-top: 20px; background-color: #1a1a1a; color: #4682b4; border: 1px solid #4682b4;">
        <img src="icons/icon-wipe/icon-wipe-all-logs-and-clipboard-skull-crossbones.svg" class="btn-icon">
        !TESTING VERSION!<br> Wipe All Logs & Clipboard
        <img src="icons/icon-wipe/icon-wipe-all-logs-and-clipboard-skull-crossbones.svg" class="btn-icon">
    </button>
    <button id="clearBtn" class="btn">!TESTING VERSION! <br>Clear Current Log</button>

    <script src="popup.js"></script>
</body>
</html>
